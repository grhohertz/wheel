[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-trader"
version = "0.1.0"
description = "Paper-trading wheel-strategy engine (covered calls + cash-secured puts) for a single account."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["python-dotenv"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
wheel-trader = "wheel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
